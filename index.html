<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Сабақты бақылау — Сәтбаев қаласының білім бөлімі</title>
<link rel="icon" href="logo.png">
<style>
:root{
  --bg:#f3f6fb; --card:#fff; --ink:#14213d; --muted:#5b6780; --line:#d9e0ec;
  --brand:#1746a2; --brand-d:#0f2f73; --brand-l:#e6edfb;
  --hi:#12805c; --hi-bg:#e3f5ee; --mid:#a76400; --mid-bg:#fdf1dc; --lo:#b3261e; --lo-bg:#fde8e6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
.hidden{display:none!important}
header.top{background:linear-gradient(120deg,var(--brand-d),var(--brand));color:#fff}
.top-in{max-width:1180px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px}
.top img{height:52px;width:auto;background:#fff;border-radius:10px;padding:4px}
.top h1{font-size:18px}
.top .sub{font-size:13px;opacity:.85}
.yr{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap;background:var(--brand-l);color:var(--brand);vertical-align:middle}
.top .yr{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4)}
.top .who{margin-left:auto;text-align:right;font-size:13px}
.top .who button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;margin-left:6px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:#fff;color:var(--muted);padding:5px 9px;cursor:pointer;font-size:12.5px;font-weight:700;margin:0}
.lang button.on{background:var(--brand);color:#fff}
.top .lang{border-color:rgba(255,255,255,.4);margin-bottom:6px}
.top .who .lang button{background:transparent;color:#fff;border:0;border-radius:0;margin:0}
.top .who .lang button.on{background:#fff;color:var(--brand)}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs-in{max-width:1180px;margin:0 auto;padding:0 8px;display:flex;gap:2px;overflow-x:auto}
.tabs button{border:0;background:none;padding:13px 14px;cursor:pointer;white-space:nowrap;color:var(--muted);border-bottom:3px solid transparent;font-weight:600}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{font-size:17px;margin-bottom:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 180px}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-weight:400}
label.f textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:9px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--brand-d)}
.btn.ghost{background:#fff;color:var(--brand)}
.btn.ghost:hover{background:var(--brand-l)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.danger{border-color:var(--lo);background:#fff;color:var(--lo)}
.btn.danger.arm{background:var(--lo);color:#fff}
.btn[disabled]{opacity:.55;cursor:wait}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted)}
.banner{background:var(--mid-bg);color:#6b4300;border:1px solid #f0d49c;border-radius:10px;padding:9px 12px;margin-bottom:14px;font-size:14px}
/* login */
.login{max-width:480px;margin:6vh auto;padding:0 16px}
.login .card{padding:24px}
.login .langrow{text-align:right;margin-bottom:6px}
.login img{height:84px;display:block;margin:0 auto 10px}
.login h1{font-size:20px;text-align:center;margin-bottom:4px}
.login p.c{text-align:center;color:var(--muted);margin:0 0 16px}
.login label.f{margin-bottom:12px}
.err{color:var(--lo);font-size:14px;margin:8px 0;min-height:1em}
details{margin-top:14px;font-size:14px}
details summary{cursor:pointer;color:var(--brand);font-weight:600}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font-size:26px;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.lvl{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.lvl.hi{background:var(--hi-bg);color:var(--hi)} .lvl.mid{background:var(--mid-bg);color:var(--mid)} .lvl.lo{background:var(--lo-bg);color:var(--lo)}
/* tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--brand-l);font-size:13px}
td.n,th.n{text-align:center}
tr.avg td{background:#f6f8fc;font-weight:700}
tr.click{cursor:pointer} tr.click:hover td{background:#f6f9ff}
.bar{height:8px;background:#e7ecf5;border-radius:99px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.small{font-size:12.5px;color:var(--muted)}
/* criteria */
.crit{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crit .t{font-weight:600;flex:1 1 220px}
.seg{display:flex;gap:6px}
.seg button{width:52px;height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:18px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.sum{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px 0 4px;font-size:16px}
.sum b{font-size:22px}
.maket-head{margin-bottom:12px}
.maket-head h3{font-size:15px;text-align:center;margin-bottom:10px}
.maket-head div{font-size:14px;margin:2px 0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 16px;border-radius:10px;z-index:20;max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.bad{background:var(--lo)}
@media (max-width:640px){.top h1{font-size:15px}.top .sub{display:none}.top img{height:40px}.seg button{width:48px}}
@media print{
  header.top,nav.tabs,.noprint,#toast{display:none!important}
  body{background:#fff;font-size:11px} main{max-width:none;padding:0}
  .card{border:0;padding:0} .scroll{overflow:visible} th,td{padding:3px 4px}
  @page{size:A4 landscape;margin:10mm}
}
</style>
</head>
<body>

<!-- ================= КІРУ ================= -->
<div id="login" class="login">
  <div class="card">
    <div class="langrow"><span class="lang"><button data-lang="kk">ҚАЗ</button><button data-lang="ru">РУС</button><button data-lang="en">ENG</button></span></div>
    <img src="logo.png" alt="" onerror="this.remove()">
    <h1 data-i18n="appName"></h1>
    <p class="c" data-i18n="loginSub"></p>
    <p class="c"><span class="yr"></span></p>
    <label class="f"><span data-i18n="lgName"></span>
      <input id="lgName" autocomplete="name" data-ph="lgNamePh">
    </label>
    <label class="f"><span data-i18n="lgToken"></span>
      <input id="lgToken" type="password" autocomplete="off" placeholder="github_pat_…">
    </label>
    <div class="err" id="lgErr"></div>
    <div class="btns">
      <button class="btn" id="lgBtn" data-i18n="enter"></button>
      <button class="btn ghost" id="lgDemo" data-i18n="demoBtn"></button>
    </div>
    <details>
      <summary data-i18n="keyQ"></summary>
      <p class="note" data-i18n="keyA1"></p>
      <p class="note" data-i18n="keyA2"></p>
    </details>
  </div>
</div>

<!-- ================= ҚОЛДАНБА ================= -->
<div id="app" class="hidden">
<header class="top"><div class="top-in">
  <img src="logo.png" alt="" onerror="this.remove()">
  <div><h1><span data-i18n="appName"></span> <span class="yr"></span></h1><div class="sub" data-i18n="appSub"></div></div>
  <div class="who"><span class="lang"><button data-lang="kk">ҚАЗ</button><button data-lang="ru">РУС</button><button data-lang="en">ENG</button></span><br>
    <span id="whoName"></span><br><button id="btnRefresh" data-i18n="refresh"></button><button id="btnOut" data-i18n="logout"></button></div>
</div></header>
<nav class="tabs noprint"><div class="tabs-in">
  <button data-tab="home" class="on" data-i18n="tabHome"></button>
  <button data-tab="form" data-i18n="tabForm"></button>
  <button data-tab="table" data-i18n="tabTable"></button>
  <button data-tab="prog" data-i18n="tabProg"></button>
</div></nav>

<main>
<div id="demoBanner" class="banner hidden noprint" data-i18n="demoBanner"></div>

<!-- Шолу -->
<section id="tab-home">
  <div class="card noprint"><div class="row">
    <label class="f"><span data-i18n="period"></span><select id="homePeriod"></select></label>
    <div class="btns" style="flex:0 1 auto"><button class="btn ghost" id="xlsAll" data-i18n="xlsAll"></button><button class="btn ghost" id="jsonAll" data-i18n="backup"></button></div>
  </div></div>
  <div class="kpis" id="homeKpis"></div>
  <div class="card"><h2 data-i18n="bySchools"></h2><div class="scroll" id="homeSchools"></div><p class="note noprint" data-i18n="rowHint"></p></div>
  <div class="card"><h2 data-i18n="critAvg"></h2><div id="homeCrit"></div></div>
</section>

<!-- Форма -->
<section id="tab-form" class="hidden">
  <div class="card">
    <h2 id="formTitle"></h2>
    <div class="row">
      <label class="f" style="flex:2 1 280px"><span data-i18n="school"></span><select id="fSchool"></select></label>
      <label class="f"><span data-i18n="obsDate"></span><input type="date" id="fDate"></label>
    </div>
    <div class="row" style="margin-top:12px">
      <label class="f" style="flex:2 1 240px"><span data-i18n="teacherName"></span><input id="fTeacher" list="dlTeachers" autocomplete="off" data-ph="teacherPh"><datalist id="dlTeachers"></datalist></label>
      <label class="f"><span data-i18n="subject"></span><input id="fSubject" list="dlSubjects" data-ph="subjectPh"><datalist id="dlSubjects"></datalist></label>
      <label class="f" style="flex:0 1 110px"><span data-i18n="klass"></span><input id="fKlass" data-ph="klassPh"></label>
    </div>
    <div class="row" style="margin-top:12px">
      <label class="f"><span data-i18n="category"></span><input id="fCat" list="dlCats" data-ph="catPh"><datalist id="dlCats"></datalist></label>
      <label class="f" style="flex:0 1 140px"><span data-i18n="exp"></span><input id="fExp" type="number" min="0" max="60" inputmode="numeric"></label>
      <label class="f"><span data-i18n="observer"></span><input id="fObserver"></label>
    </div>
  </div>
  <div class="card">
    <h2 data-i18n="scoring"></h2>
    <p class="note" data-i18n="scaleShort"></p>
    <div id="fCrit"></div>
    <div class="sum"><span data-i18n="totalLbl"></span> <b id="fTotal">–</b> / 18 <span><span data-i18n="qualityLbl"></span> <b id="fPct">–</b></span> <span id="fLevel"></span></div>
  </div>
  <div class="card">
    <label class="f"><span data-i18n="noteLbl"></span><textarea id="fNote"></textarea></label>
    <div class="err" id="fErr"></div>
    <div class="btns"><button class="btn" id="fSave"></button><button class="btn ghost" id="fClear" data-i18n="clear"></button></div>
  </div>
</section>

<!-- Жиынтық кесте -->
<section id="tab-table" class="hidden">
  <div class="card noprint"><div class="row">
    <label class="f" style="flex:2 1 280px"><span data-i18n="school"></span><select id="tSchool"></select></label>
    <label class="f"><span data-i18n="period"></span><select id="tPeriod"></select></label>
    <div class="btns" style="flex:0 1 auto"><button class="btn" id="xlsOne" data-i18n="xlsOne"></button><button class="btn ghost" id="printOne" data-i18n="print"></button></div>
  </div></div>
  <div class="card" id="tOut"></div>
</section>

<!-- Прогресс -->
<section id="tab-prog" class="hidden">
  <div class="card noprint"><div class="row">
    <label class="f" style="flex:2 1 280px"><span data-i18n="school"></span><select id="pSchool"></select></label>
  </div></div>
  <div class="card"><h2 data-i18n="schoolByPeriod"></h2><div class="scroll" id="pPeriods"></div></div>
  <div class="card"><h2 data-i18n="teacherProg"></h2><div class="scroll" id="pTeachers"></div>
    <p class="note" data-i18n="progHint"></p></div>
</section>
</main>
</div>
<div id="toast" class="hidden"></div>

<script>

/* Мектептер: дерекке қазақша атауы жазылады (SCHOOLS), ru/en тек көрсету үшін. Ретін өзгертпеңіз. */

    'Общеобразовательная школа №5','Общеобразовательная школа №7','Общеобразовательная школа имени К.Сатпаева','Общеобразовательная школа №14',

};
const NCRIT = 6, MAXP = NCRIT * 3;
const EXCELJS = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';

/* ============ ТІЛДЕР ============ */
const I18N = {

  locale:'kk-KZ', docTitle:'Сабақты бақылау — Сәтбаев қаласының білім бөлімі',

  lgName:'Әдіскердің аты-жөні', lgNamePh:'Мысалы: Жунусова А.Д.', lgToken:'Кіру кілті', enter:'Кіру', demoBtn:'Демо режимде көру',

  newTitle:'Жаңа бағалау', editTitle:'Бағалауды өңдеу', xlsOne:'Excel жүктеу', print:'Басып шығару / PDF',

/* ============ КӨМЕКШІЛЕР ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
let lang = I18N[ls.get('sb_lang')] ? ls.get('sb_lang') : 'kk';
const t = (k, ...a) => { const v = I18N[lang][k] ?? I18N.kk[k]; if(v===undefined){ console.warn('i18n missing: '+k); return k; } return typeof v==='function' ? v(...a) : v; };
const crit = () => CRIT_L[lang];
const sName = kkName => { const i=SCHOOLS.indexOf(kkName); return i<0 ? kkName : SCHOOLS_L[lang][i]; };
let toastT;
function toast(msg, bad){ const el=$('toast'); el.textContent=msg; el.className=bad?'bad':''; clearTimeout(toastT); toastT=setTimeout(()=>el.className='hidden', bad?6000:2800); }
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmtDate = s => s ? s.split('-').reverse().join('.') : '';
const total = r => r.scores.reduce((a,b)=>a+b,0);
const pct = r => total(r)/MAXP;
const pc = x => (x==null||isNaN(x)) ? '–' : Math.round(x*100)+'%';
const num = x => (x==null||isNaN(x)) ? '–' : (Math.round(x*10)/10).toLocaleString(t('locale'));
const lvKey = n => n>=15 ? 'hi' : n>=11 ? 'mid' : 'lo';
const lvName = k => t(k==='hi'?'lvHi':k==='mid'?'lvMid':'lvLo');
const lvlTag = n => { const k=lvKey(n); return `<span class="lvl ${k}">${lvName(k)}</span>`; };
const periodKey = date => { const [y,m]=date.split('-').map(Number); return (m>=9?y:y-1)+'-'+(m>=9?1:2); };
const periodLabel = key => { if(key==='all') return t('allPeriods'); const [s,h]=key.split('-').map(Number); return t('yearHalf',s,h); };
const tKey = r => r.school+'|'+r.teacher.trim().toLowerCase().replace(/\s+/g,' ');
const subjKlass = r => [r.subject, r.klass].filter(Boolean).join(', ');
const catExp = r => [r.category, (r.exp!=='' && r.exp!=null) ? r.exp+' '+t('yrs') : ''].filter(Boolean).join(', ');
function agg(recs){
  const n=recs.length, lv={hi:0,mid:0,lo:0}; let sum=0; const cs=Array(NCRIT).fill(0);
  recs.forEach(r=>{ const x=total(r); sum+=x; lv[lvKey(x)]++; r.scores.forEach((s,i)=>cs[i]+=s); });
  return { n, teachers:new Set(recs.map(tKey)).size, avgTotal:n?sum/n:NaN, avgPct:n?sum/n/MAXP:NaN, crit:cs.map(c=>n?c/n:NaN), lv };
}
const byDate = (a,b) => a.date.localeCompare(b.date) || (a.createdAt||'').localeCompare(b.createdAt||'');

const GitHubStore = token => {
  const base = `https://api.github.com/repos/${CFG.owner}/${CFG.dataRepo}`;
  const call = async (path, opt={}) => {
    try { return await fetch(base+path, { cache:'no-store', ...opt, headers:{ 'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', ...(opt.headers||{}) } }); }
    catch(e){ throw new ApiError(0, t('eNet')); }
  };
  const filePath = '/contents/'+CFG.path.split('/').map(encodeURIComponent).join('/');
  async function read(){
    const res = await call(filePath);
    if(res.status===404) return {records:[], sha:null};
    if(!res.ok) throw new ApiError(res.status, httpMsg(res.status));
    const j = await res.json(); let text;
    if(j.content) text = b64dec(j.content);
    else { const b = await call('/git/blobs/'+j.sha); if(!b.ok) throw new ApiError(b.status, httpMsg(b.status)); text = b64dec((await b.json()).content); }
    let data; try { data = JSON.parse(text); } catch(e){ throw new ApiError(0, t('eCorrupt')); }
    return {records: Array.isArray(data.records)?data.records:[], sha:j.sha};
  }
  return {
    demo:false,
    async check(){
      const res = await call('');
      if(res.status===401) throw new ApiError(401, t('eKey'));
      if(res.status===404) throw new ApiError(404, t('eNoAccess'));
      if(!res.ok) throw new ApiError(res.status, httpMsg(res.status));
    },
    async load(){ return (await read()).records; },
    // Соңғы нұсқаны алып, өзгерісті қолданып, жазады. Қатар сақтау болса, қайталайды.
    async commit(mutate, message){
      for(let i=0;i<5;i++){
        const cur = await read();
        const next = mutate(cur.records.slice());
        const body = { message, content: b64enc(JSON.stringify({version:1, updatedAt:new Date().toISOString(), records:next}, null, 1)) };
        if(cur.sha) body.sha = cur.sha;
        const res = await call(filePath, {method:'PUT', body:JSON.stringify(body)});
        if(res.ok) return next;
        if(res.status===409 || res.status===422){ await new Promise(r=>setTimeout(r,400*(i+1))); continue; }
        if(res.status===403) throw new ApiError(403, t('eReadOnly'));
        throw new ApiError(res.status, httpMsg(res.status));
      }
      throw new ApiError(409, t('eConflict'));
    }
  };
};

const DemoStore = () => {
  const K='sb_demo_records';
  const read = () => { try { const v=JSON.parse(ls.get(K)); if(Array.isArray(v)) return v; } catch(e){} return null; };
  let mem = read() || seed();
  return { demo:true, async check(){}, async load(){ return mem; },
    async commit(mutate){ mem = mutate(mem.slice()); ls.set(K, JSON.stringify(mem)); return mem; } };
};

    mk(0,`${s}-10-22`,'Смағұлова А.Т. (үлгі)','Қазақ тілі','7 «Б»','Педагог-сарапшы',8,[3,2,2,1,2,2],'Тапсырмаларды саралау бойынша әдістемелік көмек қажет.'),
    mk(2,`${s}-10-07`,'Жұмабаев Е.С. (үлгі)','Физика','10 «А»','Педагог-модератор',5,[2,1,2,1,2,1],'Белсенді әдістер бойынша семинарға қатысу ұсынылады.'),

async function enter(st, name){
  $('lgErr').textContent=''; $('lgBtn').disabled=true;
  try { await st.check(); records = await st.load(); }
  catch(e){ $('lgErr').textContent=e.message||t('eGeneric'); $('lgBtn').disabled=false; return false; }
  store=st; me=name; $('lgBtn').disabled=false;
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('demoBanner').classList.toggle('hidden', !store.demo);
  applyLang(); resetForm(); show('home');
  return true;
}
$('lgBtn').onclick = async () => {
  const name=$('lgName').value.trim(), token=$('lgToken').value.trim();
  if(!name){ $('lgErr').textContent=t('eName'); return; }
  if(!token){ $('lgErr').textContent=t('eToken'); return; }
  if(await enter(GitHubStore(token), name)){ ls.set('sb_token',token); ls.set('sb_name',name); }
};
$('lgDemo').onclick = async () => { await enter(DemoStore(), $('lgName').value.trim()||t('demoUser')); };
$('btnOut').onclick = () => { if(!store.demo) ls.del('sb_token'); location.reload(); };

let curTab='home';
function show(tab){ curTab=tab;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  ['home','form','table','prog'].forEach(x=>$('tab-'+x).classList.toggle('hidden', x!==tab));
  render(); window.scrollTo(0,0);
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{ if(b.dataset.tab==='form' && editId) resetForm(); show(b.dataset.tab); });
function initSelects(){
  const opts = SCHOOLS_L[lang].map((s,i)=>`<option value="${i}">${i+1}. ${esc(s)}</option>`).join('');
  ['fSchool','tSchool','pSchool'].forEach(id=>{ const v=$(id).value; $(id).innerHTML=opts; if(v) $(id).value=v; });
  ['tSchool','pSchool','tPeriod','homePeriod'].forEach(id=>$(id).onchange=render);
  $('fSchool').onchange = fillLists;
}
function fillPeriods(id){
  const el=$(id), v=el.value, ps=periodsAll(), cur=periodKey(today());
  if(!ps.includes(cur)) ps.unshift(cur);
  el.innerHTML = `<option value="all">${esc(t('allPeriods'))}</option>` + ps.map(k=>`<option value="${k}">${esc(periodLabel(k))}</option>`).join('');
  el.value = [...el.options].some(o=>o.value===v) ? v : 'all';
}
function render(){
  if(!store) return;
  fillPeriods('homePeriod'); fillPeriods('tPeriod');
  if(curTab==='home') renderHome(); if(curTab==='table') renderTable(); if(curTab==='prog') renderProg(); if(curTab==='form') fillLists();
}

/* ============ ФОРМА ============ */
function renderCrit(){
  $('fCrit').innerHTML = crit().map((c,i)=>`<div class="crit"><div class="t">${esc(c)}</div><div class="seg" role="group" aria-label="${esc(c)}">${[0,1,2,3].map(v=>`<button type="button" data-i="${i}" data-v="${v}" class="${formScores[i]===v?'on':''}" aria-pressed="${formScores[i]===v}">${v}</button>`).join('')}</div></div>`).join('');
  $('fCrit').querySelectorAll('button').forEach(b=>b.onclick=()=>{ formScores[+b.dataset.i]=+b.dataset.v; renderCrit(); });
  const done = formScores.every(v=>v!==null), n=formScores.reduce((a,b)=>a+(b||0),0);
  $('fTotal').textContent = done? n : '–'; $('fPct').textContent = done? pc(n/MAXP) : '–'; $('fLevel').innerHTML = done? lvlTag(n) : '';
}
function fillLists(){
  const s=SCHOOLS[+$('fSchool').value], seen=new Map();
  live().filter(r=>r.school===s).sort(byDate).forEach(r=>seen.set(tKey(r),r));
  $('dlTeachers').innerHTML=[...seen.values()].map(r=>`<option value="${esc(r.teacher)}">`).join('');
  $('dlSubjects').innerHTML=[...new Set(live().map(r=>r.subject).filter(Boolean))].sort().map(x=>`<option value="${esc(x)}">`).join('');
}
$('fTeacher').addEventListener('change', ()=>{ // бұрын бағаланған мұғалімнің деректерін автоматты толтыру
  const s=SCHOOLS[+$('fSchool').value], k=s+'|'+$('fTeacher').value.trim().toLowerCase().replace(/\s+/g,' ');
  const prev=live().filter(r=>tKey(r)===k).sort(byDate).pop(); if(!prev) return;
  if(!$('fSubject').value) $('fSubject').value=prev.subject||''; if(!$('fKlass').value) $('fKlass').value=prev.klass||'';
  if(!$('fCat').value) $('fCat').value=prev.category||''; if($('fExp').value==='') $('fExp').value=prev.exp??'';
});
function resetForm(keepSchool){
  editId=null; formScores=Array(NCRIT).fill(null);
  $('formTitle').textContent=t('newTitle'); $('fSave').textContent=t('save');
  if(!keepSchool) $('fSchool').value = ls.get('sb_school') || '0';
  $('fDate').value=today(); ['fTeacher','fSubject','fKlass','fCat','fExp','fNote'].forEach(id=>$(id).value='');
  $('fObserver').value=me; $('fErr').textContent=''; renderCrit(); fillLists();
}
$('fClear').onclick=()=>resetForm(true);
function editRec(id){
  const r=records.find(x=>x.id===id); if(!r) return;
  resetForm(); editId=id; formScores=r.scores.slice();
  $('formTitle').textContent=t('editTitle'); $('fSave').textContent=t('saveEdit');
  $('fSchool').value=Math.max(0,SCHOOLS.indexOf(r.school)); $('fDate').value=r.date; $('fTeacher').value=r.teacher; $('fSubject').value=r.subject||'';
  $('fKlass').value=r.klass||''; $('fCat').value=r.category||''; $('fExp').value=r.exp??''; $('fNote').value=r.note||''; $('fObserver').value=r.observer||me;
  show('form');
}
$('fSave').onclick = async () => {
  const g=id=>$(id).value.trim(), err=m=>{ $('fErr').textContent=m; };
  if(!g('fTeacher')) return err(t('eTeacher'));
  if(!g('fSubject')) return err(t('eSubject'));
  if(!$('fDate').value) return err(t('eDate'));
  if($('fDate').value>today()) return err(t('eFuture'));
  if(formScores.some(v=>v===null)) return err(t('eScores'));
  err('');
  const now=new Date().toISOString(), old=editId && records.find(x=>x.id===editId);
  const rec={ id: editId||uid(), school:SCHOOLS[+$('fSchool').value], date:$('fDate').value, teacher:g('fTeacher'), subject:g('fSubject'), klass:g('fKlass'),
    category:g('fCat'), exp: g('fExp')===''?'':Number(g('fExp')), scores:formScores.slice(), note:g('fNote'), observer:g('fObserver')||me,
    createdAt: old?old.createdAt:now, updatedAt: now, updatedBy: me };
  $('fSave').disabled=true;
  try {
    records = await store.commit(list=>{ const i=list.findIndex(x=>x.id===rec.id); if(i>=0) list[i]=rec; else list.push(rec); return list; },
      (old?'Өңдеу: ':'Бағалау: ')+rec.school+', '+fmtDate(rec.date));
    ls.set('sb_school',$('fSchool').value);
    toast(t(old?'tEdited':'tSaved'));
    const sIdx=$('fSchool').value; resetForm(true);
    if(old){ $('tSchool').value=sIdx; show('table'); } else window.scrollTo(0,0);
  } catch(e){ err(e.message); toast(e.message,true); }
  $('fSave').disabled=false;
};
async function delRec(id){
  try { records = await store.commit(list=>list.filter(x=>x.id!==id), 'Өшіру'); toast(t('tDeleted')); render(); }
  catch(e){ toast(e.message,true); }
}

/* ============ ПРОГРЕСС ============ */
function spark(vals){
  const w=110,h=30,p=4; if(vals.length<2) return '';
  const pts=vals.map((v,i)=>[p+i*(w-2*p)/(vals.length-1), h-p-v*(h-2*p)]);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="#1746a2" stroke-width="2" points="${pts.map(q=>q.map(n=>n.toFixed(1)).join(',')).join(' ')}"/>${pts.map(q=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="2.6" fill="#1746a2"/>`).join('')}</svg>`;
}
function renderProg(){
  const recs=live().filter(r=>r.school===SCHOOLS[+$('pSchool').value]).sort(byDate);
  if(!recs.length){ $('pPeriods').innerHTML=$('pTeachers').innerHTML=`<p class="note">${t('noObsSchool')}</p>`; return; }
  const pm=new Map(); recs.forEach(r=>{ const k=periodKey(r.date); if(!pm.has(k)) pm.set(k,[]); pm.get(k).push(r); });
  let h=`<table><tr><th>${t('period')}</th><th class="n">${t('lessons')}</th><th class="n">${t('teachers')}</th><th class="n">${t('avgScore')}</th><th class="n">${t('qualityPct')}</th><th class="n">${t('hi')}</th><th class="n">${t('mid')}</th><th class="n">${t('lo')}</th><th class="n">${t('change')}</th></tr>`, prev=null;
  [...pm].sort((a,b)=>a[0].localeCompare(b[0])).forEach(([k,v])=>{ const x=agg(v);
    h+=`<tr><td>${esc(periodLabel(k))}</td><td class="n">${x.n}</td><td class="n">${x.teachers}</td><td class="n">${num(x.avgTotal)}</td><td class="n"><b>${pc(x.avgPct)}</b></td><td class="n">${x.lv.hi}</td><td class="n">${x.lv.mid}</td><td class="n">${x.lv.lo}</td><td class="n">${delta(prev,x.avgPct)}</td></tr>`; prev=x.avgPct; });
  $('pPeriods').innerHTML=h+'</table>';
  const tm=new Map(); recs.forEach(r=>{ const k=tKey(r); if(!tm.has(k)) tm.set(k,[]); tm.get(k).push(r); });
  h=`<table><tr><th class="n">${t('no')}</th><th>${t('hTeacher')}</th><th>${t('pSubject')}</th><th class="n">${t('pCount')}</th><th>${t('pList')}</th><th class="n">${t('first')}</th><th class="n">${t('last')}</th><th class="n">${t('change')}</th><th>${t('dynamics')}</th><th>${t('lastLevel')}</th></tr>`;
  [...tm.values()].sort((a,b)=>a[a.length-1].teacher.localeCompare(b[b.length-1].teacher,'kk')).forEach((list,i)=>{ const f=list[0], l=list[list.length-1];
    h+=`<tr><td class="n">${i+1}</td><td>${esc(l.teacher)}</td><td>${esc(l.subject)}</td><td class="n">${list.length}</td><td class="small">${list.map(r=>fmtDate(r.date)+' – '+pc(pct(r))).join('<br>')}</td>
      <td class="n">${pc(pct(f))}</td><td class="n"><b>${pc(pct(l))}</b></td><td class="n">${list.length>1?delta(pct(f),pct(l)):'–'}</td><td>${spark(list.map(pct))}</td><td>${lvlTag(total(l))}</td></tr>`; });
  $('pTeachers').innerHTML=h+'</table>';
}
function delta(a,b){ if(a==null||isNaN(a)) return '–'; const d=Math.round(b*100)-Math.round(a*100);
  return d>0?`<b style="color:var(--hi)">▲ +${d}%</b>` : d<0?`<b style="color:var(--lo)">▼ ${d}%</b>` : `<span class="small">${t('same')}</span>`; }

/* ============ ЕСЕП ЖҮКТЕУ ============ */
function download(blob, name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
function loadExcel(){ return window.ExcelJS ? Promise.resolve() : new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=EXCELJS; s.onload=ok; s.onerror=()=>no(new Error(t('eExcel'))); document.head.appendChild(s); }); }
const F={name:'Times New Roman',size:12};
const thin={style:'thin',color:{argb:'FF000000'}}, box={top:thin,left:thin,bottom:thin,right:thin};
const headFill={type:'pattern',pattern:'solid',fgColor:{argb:'FFDCE6F7'}};
function addSchoolSheet(wb, name, school, recs, label){
  const ws=wb.addWorksheet(name,{pageSetup:{orientation:'landscape',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:.4,right:.4,top:.5,bottom:.5,header:.2,footer:.2}}});
  [5,28,20,22,12,12,12,12,12,12,12,10,17,42].forEach((w,i)=>ws.getColumn(i+1).width=w);
  const wrap={wrapText:true,vertical:'middle'}, ctr={...wrap,horizontal:'center'}, bold={...F,bold:true};
  ws.mergeCells('A1:N1'); ws.getCell('A1').value=t('title'); ws.getCell('A1').font={...F,bold:true,size:13}; ws.getCell('A1').alignment=ctr; ws.getRow(1).height=30;
  [[t('orgName'),school],[t('goalLbl'),t('goal')],[t('termLbl'),label]].forEach((p,i)=>{ const r=i+2;
    ws.mergeCells(r,1,r,3); ws.mergeCells(r,4,r,14); ws.getCell(r,1).value=p[0]; ws.getCell(r,1).font=bold; ws.getCell(r,4).value=p[1]; ws.getCell(r,4).font=F; ws.getCell(r,4).alignment=wrap; });
  ws.mergeCells('A5:N5'); ws.getCell('A5').value=t('scale'); ws.getCell('A5').font={...F,italic:true};
  const head=[t('no'),t('hTeacher'),t('hSubj'),t('hCat'),...crit(),t('hTotal'),t('qualityPct'),t('hLevel'),t('noteLbl')];
  head.forEach((x,i)=>{ const c=ws.getCell(7,i+1); c.value=x; c.font=bold; c.alignment=ctr; c.border=box; c.fill=headFill; });
  ws.getRow(7).height=62;
  const r0=8, n=Math.max(recs.length,1), rN=r0+n-1, HI=t('lvHi'), MID=t('lvMid'), LO=t('lvLo');
  for(let i=0;i<n;i++){ const r=r0+i, x=recs[i], row=ws.getRow(r);
    row.getCell(1).value=i+1;
    if(x){ const s=total(x);
      row.getCell(2).value=x.teacher; row.getCell(3).value=subjKlass(x)+'\n'+fmtDate(x.date); row.getCell(4).value=catExp(x);
      x.scores.forEach((v,j)=>row.getCell(5+j).value=v);
      row.getCell(11).value={formula:`IF(COUNT(E${r}:J${r})>0,SUM(E${r}:J${r}),"")`,result:s};
      row.getCell(12).value={formula:`IF(K${r}<>"",K${r}/${MAXP},"")`,result:s/MAXP};
      row.getCell(13).value={formula:`IF(K${r}="","",IF(K${r}>=15,"${HI}",IF(K${r}>=11,"${MID}","${LO}")))`,result:lvName(lvKey(s))};
      row.getCell(14).value=x.note||''; }
    for(let c=1;c<=14;c++){ const cell=row.getCell(c); cell.font=F; cell.border=box; cell.alignment=(c===2||c===14)?wrap:ctr; }
    row.getCell(12).numFmt='0%';
  }
  const a=agg(recs), rA=rN+1; ws.mergeCells(rA,2,rA,4); ws.getCell(rA,2).value=t('schoolAvg');
  'EFGHIJKL'.split('').forEach((L,j)=>{ const c=ws.getCell(L+rA); const res = j<6 ? a.crit[j] : j===6 ? a.avgTotal : a.avgPct;
    c.value={formula:`IFERROR(AVERAGE(${L}${r0}:${L}${rN}),"")`,result:isNaN(res)?'':res}; c.numFmt = L==='L'?'0%':'0.0'; });
  for(let c=1;c<=14;c++){ const cell=ws.getCell(rA,c); cell.font=bold; cell.border=box; cell.alignment=c===2?wrap:ctr; cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF2F2F2'}}; }
  const d=rA+2; ws.mergeCells(d,2,d,6); ws.getCell(d,2).value=t('distTitle'); ws.getCell(d,2).font=bold;
  [t('dLevel'),t('dRange'),t('dShare'),t('dCount'),t('dPct')].forEach((x,i)=>{ const c=ws.getCell(d+1,2+i); c.value=x; c.font=bold; c.border=box; c.alignment=ctr; c.fill=headFill; });
  const rng=`M${r0}:M${rN}`, cnt=`COUNT(K${r0}:K${rN})`;
  [[HI,t('r1'),'83% – 100%',a.lv.hi],[MID,t('r2'),'61% – 82%',a.lv.mid],[LO,t('r3'),'≤ 60%',a.lv.lo]].forEach((p,i)=>{ const r=d+2+i;
    ws.getCell(r,2).value=p[0]; ws.getCell(r,3).value=p[1]; ws.getCell(r,4).value=p[2];
    ws.getCell(r,5).value={formula:`COUNTIF(${rng},"${p[0]}")`,result:p[3]};
    ws.getCell(r,6).value={formula:`IF(${cnt}>0,E${r}/${cnt},0)`,result:a.n?p[3]/a.n:0}; ws.getCell(r,6).numFmt='0%';
    for(let c=2;c<=6;c++){ const cell=ws.getCell(r,c); cell.font=F; cell.border=box; cell.alignment=c===2?wrap:ctr; } });
  const rT=d+5; ws.mergeCells(rT,2,rT,4); ws.getCell(rT,2).value=t('dTotalX');
  ws.getCell(rT,5).value={formula:cnt,result:a.n}; ws.getCell(rT,6).value={formula:`IF(${cnt}>0,SUM(F${d+2}:F${d+4}),0)`,result:a.n?1:0}; ws.getCell(rT,6).numFmt='0%';
  for(let c=2;c<=6;c++){ const cell=ws.getCell(rT,c); cell.font=bold; cell.border=box; cell.alignment=c===2?wrap:ctr; }
}
const sheetName = i => ((i+1)+'. '+SCHOOLS_L[lang][i].replace(/[\\\/\?\*\[\]:]/g,'').replace(/ КММ$/,'')).slice(0,31);
async function saveWb(wb, name){ const buf=await wb.xlsx.writeBuffer(); download(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), name); }
async function withBtn(btn, fn){ btn.disabled=true; try { await loadExcel(); await fn(); toast(t('tReport')); } catch(e){ toast(e.message||t('eGeneric'),true); } btn.disabled=false; }
$('xlsOne').onclick=function(){ withBtn(this, async()=>{ const {idx,school,recs,label}=tableData();
  const wb=new ExcelJS.Workbook(); addSchoolSheet(wb, sheetName(idx), school, recs, label);
  await saveWb(wb, `${t('fileOne')}_${idx+1}_${today()}.xlsx`); }); };
$('xlsAll').onclick=function(){ withBtn(this, async()=>{ const key=$('homePeriod').value, recs=inPeriod(live(),key), label=periodLabel(key);
  const wb=new ExcelJS.Workbook(), ws=wb.addWorksheet(t('citySheet'),{pageSetup:{orientation:'landscape',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0}});
  [5,46,13,13,13,12,12,12,12].forEach((w,i)=>ws.getColumn(i+1).width=w);
  const ctr={wrapText:true,vertical:'middle',horizontal:'center'};
  ws.mergeCells('A1:I1'); ws.getCell('A1').value=t('cityTitle'); ws.getCell('A1').font={...F,bold:true,size:13}; ws.getCell('A1').alignment=ctr; ws.getRow(1).height=30;
  ws.mergeCells('A2:I2'); ws.getCell('A2').value=t('termLbl')+' '+label; ws.getCell('A2').font=F;
  [t('no'),t('school'),t('lessons'),t('teachersN'),t('kAvg'),t('qualityPct'),t('lvHi'),t('lvMid'),t('lvLo')].forEach((x,i)=>{ const c=ws.getCell(4,i+1); c.value=x; c.font={...F,bold:true}; c.alignment=ctr; c.border=box; c.fill=headFill; });
  ws.getRow(4).height=48;
  const line=(r,no,nm,x,b)=>{ [no,nm,x.n,x.teachers,isNaN(x.avgTotal)?'':x.avgTotal,isNaN(x.avgPct)?'':x.avgPct,x.lv.hi,x.lv.mid,x.lv.lo].forEach((v,i)=>{ const c=ws.getCell(r,i+1); c.value=v; c.font=b?{...F,bold:true}:F; c.border=box; c.alignment=i===1?{wrapText:true,vertical:'middle'}:ctr; }); ws.getCell(r,5).numFmt='0.0'; ws.getCell(r,6).numFmt='0%'; };
  SCHOOLS.forEach((s,i)=>line(5+i,i+1,SCHOOLS_L[lang][i],agg(recs.filter(r=>r.school===s))));
  line(5+SCHOOLS.length,'',t('city'),agg(recs),true);
  SCHOOLS.forEach((s,i)=>{ const rs=recs.filter(r=>r.school===s).sort(byDate); if(rs.length) addSchoolSheet(wb, sheetName(i), SCHOOLS_L[lang][i], rs, label); });
  await saveWb(wb, `${t('fileAll')}_${today()}.xlsx`); }); };
$('jsonAll').onclick=()=>{ download(new Blob([JSON.stringify({exportedAt:new Date().toISOString(),records},null,1)],{type:'application/json'}), `sabaq-baqylau_${today()}.json`); toast(t('tBackup')); };
