<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Сабақты бақылау — Сәтбаев қаласының білім бөлімі</title>
<link rel="icon" href="logo.png">
<style>
:root{
  --bg:#eef2f8; --card:#fff; --ink:#14213d; --muted:#5b6780; --line:#dbe2ee;
  --brand:#1746a2; --brand-d:#0f2f73; --brand-l:#e6edfb;
  --page:max(1180px, 90vw);
  --hi:#12805c; --hi-bg:#e3f5ee; --mid:#a76400; --mid-bg:#fdf1dc; --lo:#b3261e; --lo-bg:#fde8e6;
  --c-home:#1746a2; --c-form:#0d8a6a; --c-table:#6a3fc8; --c-prog:#c2650a; --c-card:#0e7490;
  --acc:var(--c-home); --acc-l:#e7eefc; --acc-d:#0f2f73;
}
body[data-tab=home]{--acc:var(--c-home);--acc-l:#e7eefc;--acc-d:#0f2f73}
body[data-tab=form]{--acc:var(--c-form);--acc-l:#e0f4ed;--acc-d:#08664e}
body[data-tab=table]{--acc:var(--c-table);--acc-l:#efe9fc;--acc-d:#4f2b9e}
body[data-tab=prog]{--acc:var(--c-prog);--acc-l:#fdf0e1;--acc-d:#8f4704}
body[data-tab=card]{--acc:var(--c-card);--acc-l:#dff2f7;--acc-d:#0a5569}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",Roboto,Arial,sans-serif;
  background-image:radial-gradient(circle at 8% 0,#dce6f8 0,transparent 38%),radial-gradient(circle at 92% 6%,#ece4fb 0,transparent 32%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
.hidden{display:none!important}
.ic{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
i[data-ic]{display:inline-flex;font-style:normal}
/* header */
header.top{background:linear-gradient(115deg,#0b3d7c 0%,#0b63a3 50%,#0a9cc4 100%);color:#fff;position:relative;overflow:hidden}
/* ҚР туының элементтері: ою-өрнек, күн шуағы, қыран (өзіміз салған стилизация) */
.hart{position:absolute;inset:0;pointer-events:none;z-index:0}
.orn{position:absolute;left:6px;top:0;bottom:0;width:34px;overflow:hidden;opacity:.95}
.orn svg{display:block;width:100%;height:auto}
.hart .se{position:absolute;top:8px;bottom:8px;right:20%;opacity:1}
.se svg{height:100%;width:auto;display:block}
.se svg.emb{overflow:visible;filter:drop-shadow(0 0 10px rgba(255,214,90,.45))}
.logo-m{width:74px;height:74px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:0 0 auto;
  box-shadow:0 0 0 3px #f2c230,0 0 0 8px rgba(242,194,48,.22),0 10px 22px -8px rgba(0,0,0,.5)}
.logo-m img{height:56px;width:auto;display:block}
@media (max-width:900px){.hart .se{right:-30px;opacity:.25}}
@media (max-width:640px){.orn{display:none}.logo-m{width:46px;height:46px}.logo-m img{height:34px}
  .top-in{padding:18px 12px;gap:10px}.top-in>div:nth-child(2){min-width:0}.top .who{font-size:11.5px;flex:0 0 auto}.top .who .hb{padding:4px 7px;margin-left:3px}.top .lang button{padding:4px 7px}.top .yr{font-size:10px;padding:1px 6px;white-space:nowrap;margin-top:3px}}
@media (max-width:420px){.top h1 .yr{display:none}}
.top-in{max-width:var(--page);margin:0 auto;padding:33px 16px;padding-left:max(16px, calc(56px - max(0px, (100vw - var(--page)) / 2)));display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.top h1{font-size:20px}
.top .sub{font-size:13px;opacity:.85}
.yr{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap;background:var(--brand-l);color:var(--brand);vertical-align:middle}
.top .yr{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4)}
.top .who{margin-left:auto;text-align:right;font-size:13px}
.top .who .hb{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;margin-left:6px}
.top .who .hb:hover{background:rgba(255,255,255,.25)}
.top .who .hb .ic{width:15px;height:15px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:#fff;color:var(--muted);padding:5px 9px;cursor:pointer;font-size:12.5px;font-weight:700;margin:0}
.lang button.on{background:var(--brand);color:#fff}
.top .lang{border-color:rgba(255,255,255,.4);margin-bottom:6px}
.top .who .lang button{background:transparent;color:#fff}
.top .who .lang button.on{background:#fff;color:var(--brand)}
/* tabs */
nav.tabs{background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6;box-shadow:0 2px 10px -6px rgba(20,33,61,.25)}
.tabs-in{max-width:var(--page);margin:0 auto;padding:8px 10px;display:flex;gap:6px;overflow-x:auto}
.tabs button{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:none;padding:9px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:600}
.tabs button[data-tab=home]{--tc:var(--c-home)} .tabs button[data-tab=form]{--tc:var(--c-form)}
.tabs button[data-tab=table]{--tc:var(--c-table)} .tabs button[data-tab=prog]{--tc:var(--c-prog)}
.tabs button .ic{color:var(--tc)}
.tabs button:hover{background:#f1f4fa;color:var(--ink)}
.tabs button.on{background:var(--tc);color:#fff;box-shadow:0 6px 14px -6px var(--tc)}
.tabs button.on .ic{color:#fff}
.tabs .navback{color:var(--ink);border-color:var(--line);background:#fff}
.tabs .navback .ic{color:var(--ink)}
.tabs .navback:disabled{opacity:.4;cursor:default;background:#fff}
.nsep{width:1px;background:var(--line);margin:4px 2px;flex:0 0 auto}
main{max-width:var(--page);margin:0 auto;padding:18px 16px 60px}
#tab-form{max-width:1180px;margin:0 auto}
/* hero */
.hero{display:flex;gap:14px;align-items:center;background:linear-gradient(100deg,var(--acc-l),#fff 75%);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:14px;padding:14px 18px;margin-bottom:16px}
.hero-ic{width:46px;height:46px;border-radius:12px;background:var(--acc);color:#fff;display:grid;place-items:center;flex:0 0 auto;box-shadow:0 6px 14px -6px var(--acc)}
.hero-ic .ic{width:24px;height:24px}
.hero h2{font-size:20px;color:var(--acc-d)}
.hero p{margin:2px 0 0;color:var(--muted);font-size:14px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,33,61,.04)}
.card h2{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--acc);flex:0 0 auto}
.card h2.plain::before{display:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:16px}
.grid2>.card{margin-bottom:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 180px}
.f{display:block;font-size:13px;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-weight:400}
.f input[readonly]{background:#f4f6fa;color:var(--muted)}
.f textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;transition:background .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{background:var(--acc-d);border-color:var(--acc-d);box-shadow:0 6px 14px -8px var(--acc)}
.btn.ghost{background:#fff;color:var(--acc)}
.btn.ghost:hover{background:var(--acc-l)}
.btn.excel{background:#1d7a45;border-color:#1d7a45;color:#fff}
.btn.excel:hover{background:#155c34;border-color:#155c34}
.btn.soft{background:#fff;color:var(--muted);border-color:var(--line)}
.btn.soft:hover{background:#f1f4fa;color:var(--ink)}
.btn.sm{padding:4px 9px;font-size:13px;gap:5px}
.btn.sm .ic{width:15px;height:15px}
.btn.danger{border-color:var(--lo);background:#fff;color:var(--lo)}
.btn.danger:hover{background:var(--lo-bg);box-shadow:none}
.btn.danger.arm{background:var(--lo);color:#fff}
.btn[disabled]{opacity:.55;cursor:wait}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted)}
.banner{background:var(--mid-bg);color:#6b4300;border:1px solid #f0d49c;border-radius:10px;padding:9px 12px;margin-bottom:14px;font-size:14px}
/* login */
.login{max-width:480px;margin:6vh auto;padding:0 16px}
.login .card{padding:24px;position:relative;overflow:hidden}
.lband{position:relative;margin:-24px -24px 0;height:132px;overflow:hidden;background:linear-gradient(115deg,#0b3d7c 0%,#0b63a3 50%,#0a9cc4 100%)}
.lband .se{position:absolute;left:30%;top:8px;transform:translateX(-50%);height:112px}
.lband .orn{width:30px}
.stars{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;transform:translate(-50%,-50%);background:radial-gradient(circle,#eafff5 0,#50e3a4 30%,#10b981 60%,#047857 100%);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);filter:drop-shadow(0 0 4px #34d399) drop-shadow(0 0 8px rgba(16,185,129,.7));opacity:var(--o);animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:calc(var(--o)*.5);transform:translate(-50%,-50%) scale(.7) rotate(0)}50%{opacity:var(--o);transform:translate(-50%,-50%) scale(1) rotate(20deg)}}
@media (prefers-reduced-motion:reduce){.star{animation:none}}
.login .langrow{position:absolute;top:10px;right:12px;z-index:2}
.login .langrow .lang{border-color:rgba(255,255,255,.5)}
.login .langrow .lang button{background:transparent;color:#fff}
.login .langrow .lang button.on{background:#fff;color:var(--brand)}
.logo-m.lg{width:86px;height:86px;margin:-43px auto 10px;position:relative;z-index:1}
.logo-m.lg img{height:64px}
.login h1{font-size:20px;text-align:center;margin-bottom:4px}
.login p.c{text-align:center;color:var(--muted);margin:0 0 16px}
.login .f{margin-bottom:12px}
.err{color:var(--lo);font-size:14px;margin:8px 0;min-height:1em}
details{margin-top:14px;font-size:14px}
details summary{cursor:pointer;color:var(--brand);font-weight:600}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center}
.kpi .ki{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--kb);color:var(--kc);flex:0 0 auto}
.kpi .ki .ic{width:22px;height:22px}
.kpi b{display:block;font-size:24px;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.lvl{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.lvl.hi{background:var(--hi-bg);color:var(--hi)} .lvl.mid{background:var(--mid-bg);color:var(--mid)} .lvl.lo{background:var(--lo-bg);color:var(--lo)}
/* tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--acc-l);color:var(--acc-d);font-size:13px}
td.n,th.n{text-align:center}
tr.avg td{background:#f6f8fc;font-weight:700}
tr.click{cursor:pointer} tr.click:hover td{background:#f6f9ff}
.bar{height:8px;background:#e7ecf5;border-radius:99px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.small{font-size:12.5px;color:var(--muted)}
#tOut .ct{min-width:170px}
#tOut .cn{min-width:300px}
#tOut td.cn{white-space:pre-wrap}
@media (max-width:1600px){:root{--page:max(1180px, 96vw)} #tOut .cn{min-width:240px} #tOut .lvl{white-space:normal;text-align:center}}
.tlink{background:none;border:0;padding:0;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;border-bottom:1px dashed #9aa6bd}
.tlink:hover{color:var(--acc);border-bottom-color:var(--acc)}
.lock{display:inline-flex;gap:4px;align-items:flex-start;font-size:12px;line-height:1.3;color:var(--muted);max-width:110px}
.acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.lock .ic{width:14px;height:14px}
/* мектеп таңдау */
.sp{position:relative;margin-top:4px}
.sp-btn{width:100%;display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;text-align:left;font-weight:600;color:var(--ink)}
.sp-btn:hover{border-color:var(--acc)}
.sp-btn>span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-btn::after{content:"";margin-left:auto;border:5px solid transparent;border-top-color:var(--muted);transform:translateY(3px);flex:0 0 auto}
.snum{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 4px;border-radius:8px;background:var(--sc);color:#fff;font-size:13px;font-weight:700;flex:0 0 auto}
.sp-panel{position:absolute;top:100%;left:0;z-index:12;margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px -12px rgba(20,33,61,.4);padding:8px;display:flex;flex-direction:column;gap:5px;width:min(520px,calc(100vw - 48px));max-height:min(70vh,560px);overflow-y:auto}
.sp-opt{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);border-left:5px solid var(--sc);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:500;color:var(--ink)}
.sp-opt:hover{background:color-mix(in srgb,var(--sc) 10%,#fff)}
.sp-opt.on{background:color-mix(in srgb,var(--sc) 16%,#fff);border-color:var(--sc);font-weight:700}
.sdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--sc);margin-right:8px}
.cavg{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--acc-l);font-weight:700}
.cavg b{font-size:22px}
/* search */
.search{position:relative}
.search .sin{position:relative}
.search .sin .ic{position:absolute;left:10px;top:50%;transform:translateY(-35%);color:var(--muted);pointer-events:none}
.search input{padding-left:34px!important}
.sres{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px -10px rgba(20,33,61,.35);z-index:10;max-height:340px;overflow:auto;min-width:280px}
.sr{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:9px 12px;cursor:pointer;font-weight:400}
.sr:last-child{border-bottom:0}
.sr:hover,.sr.act{background:var(--acc-l)}
.sr b{display:block;color:var(--ink)} .sr span{font-size:12.5px;color:var(--muted)}
.sr.empty{cursor:default;color:var(--muted)}
/* form */
.crit{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crit .t{font-weight:600;flex:1 1 220px}
.seg{display:flex;gap:6px}
.seg button{width:52px;height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:18px;font-weight:700;cursor:pointer;transition:.12s}
.seg button:hover{border-color:var(--acc)}
.seg button.on{color:#fff}
.seg button.on[data-v="0"]{background:#6b7280;border-color:#6b7280}
.seg button.on[data-v="1"]{background:var(--lo);border-color:var(--lo)}
.seg button.on[data-v="2"]{background:#d08a00;border-color:#d08a00}
.seg button.on[data-v="3"]{background:var(--hi);border-color:var(--hi)}
.sum{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--acc-l);font-size:16px}
.sum b{font-size:22px}
.hint{margin-top:6px;padding:8px 10px;border-radius:9px;background:var(--mid-bg);color:#6b4300;font-size:13px;font-weight:400;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.maket-head{margin-bottom:12px}
.maket-head h3{font-size:15px;text-align:center;margin-bottom:10px}
.maket-head div{font-size:14px;margin:2px 0}
/* teacher card */
.prof{display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-left:5px solid var(--acc)}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc-d));color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700;flex:0 0 auto}
.pinfo{flex:1 1 260px}
.pname{font-size:22px}
.pmeta{color:var(--muted);margin-top:3px}
.swl{list-style:none;margin:0;padding:0}
.swl li{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:9px;margin-bottom:6px}
.sw.good h2{color:var(--hi)} .sw.good h2::before{background:var(--hi)} .sw.good li{background:var(--hi-bg)}
.sw.bad h2{color:var(--lo)} .sw.bad h2::before{background:var(--lo)} .sw.bad li{background:var(--lo-bg)}
.cbar{display:flex;gap:10px;align-items:center;margin:9px 0;flex-wrap:wrap}
.cbar>div:first-child{flex:1 1 220px}
.cbar .bar{flex:2 1 160px;height:10px}
.cbar b{width:60px;text-align:right}
/* басылатын көрсеткіштер және толық ақпарат терезесі */
button.kpi{font:inherit;color:inherit;text-align:left;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
button.kpi:hover{transform:translateY(-2px);border-color:var(--kc);box-shadow:0 10px 22px -14px var(--kc)}
button.kpi:focus-visible{outline:2px solid var(--kc)}
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,20,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px;overflow-y:auto}
.mbox{background:#fff;border-radius:16px;width:min(1100px,100%);box-shadow:0 30px 60px -20px rgba(0,0,0,.45);border-top:5px solid var(--acc)}
.mhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:16px 18px 6px}
.mhead h2{font-size:19px;color:var(--acc-d)} .mhead p{margin:3px 0 0;color:var(--muted);font-size:13px}
.mbody{padding:8px 18px 18px}
.rank{display:grid;grid-template-columns:28px minmax(160px,1.4fr) 2fr 60px 70px;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.rank:hover{background:var(--acc-l)} .rank .bar{height:10px}
/* прогресс диаграммалары */
.chart svg{width:100%;height:auto;display:block}
.chart .ax{font-size:11px;fill:#5b6780} .chart .val{font-size:12px;font-weight:700;fill:#14213d}
.csum{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;font-size:14px;color:var(--muted)} .csum b{color:var(--ink);font-size:16px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mcard{display:block;text-align:left;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-top:4px solid var(--sc);border-radius:12px;padding:10px 12px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.mcard:hover{transform:translateY(-2px);box-shadow:0 10px 22px -14px var(--sc)}
.mcard.on{outline:2px solid var(--sc)}
.mcard .mh{display:flex;gap:8px;align-items:center}
.mcard .mn{font-weight:600;font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .mv{font-size:18px}
.nochart{display:grid;place-items:center;height:96px;color:var(--muted);font-size:13px;background:repeating-linear-gradient(135deg,#f6f8fc 0 8px,#fff 8px 16px);border-radius:8px;margin:6px 0}

/* Изумруд жұлдыздар: шапканың бетіне шашыраңқы, ақырын жыпылықтайды */
function emeraldStars(n, seed){
  let r=seed; const rnd=()=>(r=(r*9301+49297)%233280)/233280;
  let h='';
  for(let i=0;i<n;i++){
    const x=(rnd()*100).toFixed(2), y=(4+rnd()*92).toFixed(2), sz=(8+rnd()*12).toFixed(1), d=(rnd()*4).toFixed(2), dur=(2.4+rnd()*2.6).toFixed(2), o=(.75+rnd()*.25).toFixed(2);
    h+=`<span class="star" style="left:${x}%;top:${y}%;width:${sz}px;height:${sz}px;animation-delay:-${d}s;animation-duration:${dur}s;--o:${o}"></span>`;
  }
  return `<div class="stars">${h}</div>`;
}

/* ---- Аты-жөнді салыстыру: «Николаенко Н.А» = «Николаенко Н.А.», «Зейнекенов А.» = «Зейнекенов Ансар» ---- */
const KZ = {'ә':'а','қ':'к','ғ':'г','ң':'н','ө':'о','ұ':'у','ү':'у','һ':'х','і':'и','ё':'е'};
const norm = s => String(s||'').toLowerCase().replace(/\([^)]*\)/g,' ').replace(/[әқғңөұүһіё]/g,c=>KZ[c]).replace(/[.,;:·'"«»_]/g,' ').replace(/\s+/g,' ').trim();
function parseName(s){
  const tk = norm(s).split(' ').filter(Boolean);
  if(!tk.length) return {sur:'',i1:'',i2:''};
  let sur, rest;
  if(tk[0].length===1 && tk.length>1 && tk[tk.length-1].length>1){ sur=tk[tk.length-1]; rest=tk.slice(0,-1); } // «Н.А. Николаенко»
  else { sur=tk[0]; rest=tk.slice(1); }
  return {sur, i1:(rest[0]||'').charAt(0), i2:(rest[1]||'').charAt(0)};
}
function personMatch(a,b){ const x=parseName(a), y=parseName(b);
  return !!x.sur && x.sur===y.sur && (!x.i1||!y.i1||x.i1===y.i1) && (!x.i2||!y.i2||x.i2===y.i2); }
/* Бір мектептегі бір мұғалімнің жазбаларын топтайды. Дерекке ешнәрсе жазылмайды, тек көрсету үшін. */
function buildGroups(recs){
  const P=new Map(recs.map(r=>[r.id,parseName(r.teacher)]));
  const buckets=new Map();
  recs.forEach(r=>{ const p=P.get(r.id), k=r.school+'|'+p.sur+'|'+p.i1; if(!buckets.has(k)) buckets.set(k,[]); buckets.get(k).push(r); });
  const gidOf=new Map();
  buckets.forEach((list,k)=>{ const i2s=new Set(list.map(r=>P.get(r.id).i2).filter(Boolean));
    list.forEach(r=>{ const i2=P.get(r.id).i2; gidOf.set(r.id, i2s.size<=1 ? k : k+'|'+(i2||'?')); }); });
  recs.forEach(r=>{ const p=P.get(r.id); if(p.i1||!p.sur) return; const pre=r.school+'|'+p.sur+'|', c=new Set();   // тек тегі жазылса
    gidOf.forEach(g=>{ if(g.startsWith(pre) && g.length>pre.length) c.add(g); }); if(c.size===1) gidOf.set(r.id,[...c][0]); });
  const groups=new Map();
  recs.forEach(r=>{ const g=gidOf.get(r.id); if(!groups.has(g)) groups.set(g,{gid:g,school:r.school,recs:[],variants:new Set()});
    const o=groups.get(g); o.recs.push(r); o.variants.add(r.teacher.trim()); });
  const score=s=>norm(s).split(' ').length*1000+s.length;
  groups.forEach(o=>{ o.name=[...o.variants].sort((a,b)=>score(b)-score(a))[0]; o.recs.sort(byDate); });
  return {gidOf, groups};
}

/* ============ ДЕРЕК ҚОЙМАСЫ ============ */
const b64enc = s => { const b=new TextEncoder().encode(s); let o=''; for(let i=0;i<b.length;i+=0x8000) o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(o); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')), c=>c.charCodeAt(0)));
class ApiError extends Error{ constructor(status,msg){ super(msg); this.status=status; } }
const httpMsg = s => s===401 ? t('eKey') : s===403 ? t('e403') : s===404 ? t('e404') : t('eHttp',s);

const GitHubStore = token => {
  const base = `https://api.github.com/repos/${CFG.owner}/${CFG.dataRepo}`;
  const call = async (path, opt={}) => {
    try { return await fetch(base+path, { cache:'no-store', ...opt, headers:{ 'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', ...(opt.headers||{}) } }); }
    catch(e){ throw new ApiError(0, t('eNet')); }
  };
  const filePath = '/contents/'+CFG.path.split('/').map(encodeURIComponent).join('/');
  async function read(){
    const res = await call(filePath);
    if(res.status===404) return {records:[], sha:null};
    if(!res.ok) throw new ApiError(res.status, httpMsg(res.status));
    const j = await res.json(); let text;
    if(j.content) text = b64dec(j.content);
    else { const b = await call('/git/blobs/'+j.sha); if(!b.ok) throw new ApiError(b.status, httpMsg(b.status)); text = b64dec((await b.json()).content); }
    let data; try { data = JSON.parse(text); } catch(e){ throw new ApiError(0, t('eCorrupt')); }
    return {records: Array.isArray(data.records)?data.records:[], sha:j.sha};
  }
  return {
    demo:false,
    async check(){
      const res = await call('');
      if(res.status===401) throw new ApiError(401, t('eKey'));
      if(res.status===404) throw new ApiError(404, t('eNoAccess'));
      if(!res.ok) throw new ApiError(res.status, httpMsg(res.status));
    },
    async load(){ return (await read()).records; },
    // Соңғы нұсқаны алып, өзгерісті қолданып, жазады. Қатар сақтау болса, қайталайды.
    async commit(mutate, message){
      for(let i=0;i<5;i++){
        const cur = await read();
        const next = mutate(cur.records.slice());
        const body = { message, content: b64enc(JSON.stringify({version:1, updatedAt:new Date().toISOString(), records:next}, null, 1)) };
        if(cur.sha) body.sha = cur.sha;
        const res = await call(filePath, {method:'PUT', body:JSON.stringify(body)});
        if(res.ok) return next;
        if(res.status===409 || res.status===422){ await new Promise(r=>setTimeout(r,400*(i+1))); continue; }
        if(res.status===403) throw new ApiError(403, t('eReadOnly'));
        throw new ApiError(res.status, httpMsg(res.status));
      }
      throw new ApiError(409, t('eConflict'));
    }
  };
};

const pickers=[];
function makePicker(id){
  const sel=$(id); sel.classList.add('hidden');
  const w=document.createElement('div'); w.className='sp';
  w.innerHTML='<button type="button" class="sp-btn" aria-haspopup="listbox"></button><div class="sp-panel hidden" role="listbox"></div>';
  sel.after(w);
  const btn=w.firstChild, panel=w.lastChild;
  const draw=()=>{ const i=Math.max(0, +sel.value||0);
    btn.innerHTML=`<span class="snum" style="${scVar(i)}">${i+1}</span><span>${esc(SCHOOLS_L[lang][i])}</span>`;
    panel.innerHTML=SCHOOLS_L[lang].map((s,k)=>`<button type="button" class="sp-opt${k===i?' on':''}" data-v="${k}" role="option" style="${scVar(k)}"><span class="snum">${k+1}</span><span>${esc(s)}</span></button>`).join(''); };
  btn.onclick=()=>{ const open=panel.classList.contains('hidden'); closePickers(); if(open){ draw(); panel.classList.remove('hidden'); } };
  panel.onclick=e=>{ const o=e.target.closest('.sp-opt'); if(!o) return; sel.value=o.dataset.v; panel.classList.add('hidden'); draw(); sel.dispatchEvent(new Event('change')); };
  pickers.push({draw, panel});
}
function closePickers(){ pickers.forEach(p=>p.panel.classList.add('hidden')); }

function yearsList(){ const s=new Set(live().map(r=>syOf(r.date))); s.add(curSY()); return [...s].sort((a,b)=>b-a); }
function monthsList(sy){
  const base=[]; for(let i=0;i<10;i++){ const m=(8+i)%12+1, y=m>=9?sy:sy+1; base.push(y+'-'+String(m).padStart(2,'0')); }   // қыркүйек–маусым
  const have=new Set(live().filter(r=>syOf(r.date)===sy).map(r=>ymOf(r.date)));
  return [...new Set([...base.filter(x=>x>=START_YM || have.has(x)), ...have])].sort();
}
function fillYM(yId, mId){
  const ye=$(yId), mo=$(mId), yv=ye.value, mv=mo.value;
  ye.innerHTML = yearsList().map(s=>`<option value="${s}">${esc(t('schoolYear',s))}</option>`).join('');

  mo.innerHTML = `<option value="all">${esc(t('allMonths'))}</option>` + monthsList(+ye.value).map(x=>`<option value="${x}">${esc(monName(x))}</option>`).join('');
  mo.value = [...mo.options].some(o=>o.value===mv) ? mv : 'all';

function agg(recs){
  const n=recs.length, lv={hi:0,mid:0,lo:0}; let sum=0; const cs=Array(NCRIT).fill(0);
  recs.forEach(r=>{ const x=total(r); sum+=x; lv[lvKey(x)]++; r.scores.forEach((s,i)=>cs[i]+=s); });
  return { n, teachers:new Set(recs.map(gid)).size, avgTotal:n?sum/n:NaN, avgPct:n?sum/n/MAXP:NaN, crit:cs.map(c=>n?c/n:NaN), lv };
}

};

  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="var(--acc)" stroke-width="2" points="${pts.map(q=>q.map(n=>n.toFixed(1)).join(',')).join(' ')}"/>${pts.map(q=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="2.6" fill="var(--acc)"/>`).join('')}</svg>`;
}
function delta(a,b){ if(a==null||isNaN(a)) return '–'; const d=Math.round(b*100)-Math.round(a*100);

function lessonTable(list){

function openKpi(k){
  const recs=filterYM(live(),'hYear','hMonth').sort(byDate).reverse(), a=agg(recs);
  let title='', body='', cnt='';
  if(k==='lessons'){ title=t('kLessons'); body=lessonTable(recs); cnt=t('obsN',recs.length); }
  else if(k==='hi'||k==='mid'||k==='lo'){ const l=recs.filter(r=>lvKey(total(r))===k); title=lvName(k); body=lessonTable(l); cnt=t('obsN',l.length); }
  else if(k==='teachers'){
    title=t('kTeachers');
    const gm=new Map(); recs.forEach(r=>{ const g=gid(r); if(!gm.has(g)) gm.set(g,[]); gm.get(g).push(r); });
    const rows=[...gm.values()].map(l=>({l:l.sort(byDate), x:agg(l)})).sort((p,q)=>q.x.avgPct-p.x.avgPct);
    cnt=rows.length;
    body = rows.length ? `<div class="scroll"><table><tr><th class="n">${t('no')}</th><th>${t('hTeacher')}</th><th>${t('school')}</th><th>${t('pSubject')}</th><th class="n">${t('pCount')}</th><th class="n">${t('kQuality')}</th><th>${t('lastLevel')}</th></tr>`
      + rows.map(({l,x},i)=>{ const last=l[l.length-1]; return `<tr><td class="n">${i+1}</td><td>${tlink(last)}<div class="small">${esc(catExpOf(l))}</div></td><td>${sdot(last.school)}${esc(sName(last.school))}</td><td>${esc([...new Set(l.map(r=>r.subject).filter(Boolean))].join(', '))}</td><td class="n">${l.length}</td><td class="n"><b>${pc(x.avgPct)}</b></td><td>${lvlTag(total(last))}</td></tr>`; }).join('') + '</table></div>'
      : `<p class="note">${t('noObsPeriod')}</p>`;
  }
  else if(k==='quality'){
    title=t('mQuality'); cnt=pc(a.avgPct);
    const rows=SCHOOLS.map((s,i)=>({i, x:agg(recs.filter(r=>r.school===s))})).sort((p,q)=>(q.x.n?q.x.avgPct:-1)-(p.x.n?p.x.avgPct:-1));
    body = rows.map(({i,x},k2)=>`<div class="rank" data-s="${i}"><b class="n">${k2+1}</b><span><span class="sdot" style="${scVar(i)}"></span>${esc(SCHOOLS_L[lang][i])}</span>
      ${x.n?`<div class="bar"><i style="width:${Math.round(x.avgPct*100)}%;background:var(--${lvKey(x.avgTotal)})"></i></div><b style="text-align:right">${pc(x.avgPct)}</b><span class="small">${esc(t('obsN',x.n))}</span>`
            :`<span class="small">${t('noObs')}</span><span></span><span></span>`}</div>`).join('') + `<p class="note">${t('rankHint')}</p>`;
  }
  else if(k==='avg'){
    title=t('mAvg'); cnt=num(a.avgTotal)+' / '+MAXP;
    const head=`<tr><th class="n">${t('no')}</th><th>${t('school')}</th>${crit().map((c,i)=>`<th class="n" title="${esc(c)}">${i+1}</th>`).join('')}<th class="n">${t('avgScore')}</th><th class="n">${t('qualityPct')}</th></tr>`;
    const cell=v=>`<td class="n" style="color:${isNaN(v)?'inherit':cColor(v)};font-weight:700">${num(v)}</td>`;
    const row=(no,name,x,cls)=>`<tr${cls?` class="${cls}"`:''}><td class="n">${no}</td><td>${name}</td>${x.crit.map(cell).join('')}<td class="n"><b>${num(x.avgTotal)}</b></td><td class="n">${pc(x.avgPct)}</td></tr>`;
    body=`<div class="scroll"><table>${head}${SCHOOLS.map((s,i)=>row(i+1,`<span class="sdot" style="${scVar(i)}"></span>${esc(SCHOOLS_L[lang][i])}`,agg(recs.filter(r=>r.school===s)))).join('')}${row('',t('city'),a,'avg')}</table></div><p class="small">${crit().map(esc).join(' · ')}</p>`;
  }
  $('mTitle').textContent=title; $('mSub').textContent=labelYM('hYear','hMonth')+(cnt!==''?' · '+cnt:'');
  $('mBody').innerHTML=body;
  $('mBody').querySelectorAll('.rank[data-s]').forEach(r=>r.onclick=()=>{ closeModal(); $('tSchool').value=r.dataset.s; $('tYear').value=$('hYear').value; fillYM('tYear','tMonth'); $('tMonth').value=$('hMonth').value; show('table'); });
  modalOpener=document.activeElement; $('modal').classList.remove('hidden'); $('mClose').focus();
}

/* ============ СЫЗЫҚТЫҚ ДИАГРАММА (прогресс) ============ */
const monShort = ym => t('months')[+ym.slice(5,7)-1].slice(0,3);
function lineChart(pts, color, o={}){
  const W=o.w||900, H=o.h||220, L=o.big?44:10, R=o.big?24:14, T=o.big?26:22, B=o.big?28:20, N=pts.length;
  const have=pts.map((p,i)=>({...p,i})).filter(p=>p.v!=null);
  if(!have.length) return `<div class="nochart">${t('noObs')}</div>`;
  const x=i=>L+(N>1 ? i*(W-L-R)/(N-1) : (W-L-R)/2), y=v=>T+(1-v)*(H-T-B);
  let g='';
  [0,.5,1].forEach(v=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e6ebf3" stroke-width="1"/>`;
    if(o.big) g+=`<text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${v*100}%</text>`; });
  pts.forEach((p,i)=>{ if(o.big || i===0 || i===N-1) g+=`<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="${o.big?'middle':(i===0?'start':'end')}">${esc(monShort(p.k))}</text>`; });
  const line=have.map(p=>`${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const area=have.length>1 ? `<polygon points="${x(have[0].i).toFixed(1)},${y(0)} ${line} ${x(have[have.length-1].i).toFixed(1)},${y(0)}" fill="${color}" opacity=".08"/>` : '';
  const last=have[have.length-1];
  const marks=have.map(p=>`<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${o.big?5:4}" fill="${color}" stroke="#fff" stroke-width="2"/>
    <circle cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="14" fill="transparent" data-tip="${esc(t('monthYear',monName(p.k),p.k.slice(0,4))+': '+pc(p.v)+' · '+t('obsN',p.n))}"/>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(have.map(p=>monName(p.k)+' '+pc(p.v)).join(', '))}">${g}${area}
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="${o.big?2.5:2}" stroke-linejoin="round" stroke-linecap="round"/>${marks}
    <text class="val" x="${x(last.i).toFixed(1)}" y="${(y(last.v)-10).toFixed(1)}" text-anchor="${last.i===N-1&&N>1?'end':'middle'}">${pc(last.v)}</text></svg></div>`;
}
function monthSeries(recs, sy){
  const cur=ymOf(today()), have=new Set(recs.map(r=>ymOf(r.date)));
  const ms=monthsList(sy).filter(m=>m<=cur || have.has(m));
  return ms.map(k=>{ const l=recs.filter(r=>ymOf(r.date)===k), x=agg(l); return {k, v:l.length?x.avgPct:null, n:l.length}; });
}
/* ============ МЕКТЕПТЕРДІ САЛЫСТЫРУ ============ */
let cmpSel = (()=>{ try { const v=JSON.parse(ls.get('sb_cmp')); if(Array.isArray(v)) return v.filter(i=>i>=0&&i<SCHOOLS.length).slice(0,6); } catch(e){} return null; })();
function multiLine(series, months, city){
  const W=900, H=290, L=44, R=150, T=20, B=30, N=months.length;
  const x=i=>L+(N>1 ? i*(W-L-R)/(N-1) : (W-L-R)/2), y=v=>T+(1-v)*(H-T-B);
  let g='';
  [0,.25,.5,.75,1].forEach(v=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e6ebf3"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${v*100}%</text>`; });
  months.forEach((k,i)=>{ g+=`<text class="ax" x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(monShort(k))}</text>`; });
  const ends=[];
  const draw=(pts,color,dash,name,w)=>{ const have=pts.map((p,i)=>({...p,i})).filter(p=>p.v!=null); if(!have.length) return '';
    let o=`<polyline points="${have.map(p=>`${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="${w}" ${dash?'stroke-dasharray="6 5"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    if(!dash) o+=have.map(p=>`<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="4.5" fill="${color}" stroke="#fff" stroke-width="2"/>
      <circle cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="13" fill="transparent" data-tip="${esc(name+' · '+t('monthYear',monName(p.k),p.k.slice(0,4))+': '+pc(p.v)+' · '+t('obsN',p.n))}"/>`).join('');
    const l=have[have.length-1]; ends.push({y:y(l.v), x:x(l.i), name, v:l.v, color, dash}); return o; };
  let lines=draw(city,'#5b6780',true,t('cityLine'),2);
  series.forEach(s=>{ lines+=draw(s.pts, s.color, false, s.name, 2.5); });
  ends.sort((a,b)=>a.y-b.y); for(let i=1;i<ends.length;i++) if(ends[i].y-ends[i-1].y<15) ends[i].y=ends[i-1].y+15;   // жазулар қабаттаспасын
  const labels=ends.map(e=>`<line x1="${W-R+6}" x2="${W-R+16}" y1="${e.y}" y2="${e.y}" stroke="${e.color}" stroke-width="3" ${e.dash?'stroke-dasharray="3 2"':''}/><text class="val" x="${W-R+20}" y="${e.y+4}">${pc(e.v)} ${esc(e.name.length>14?e.name.slice(0,13)+'…':e.name)}</text>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('cmpDyn'))}">${g}${lines}${labels}</svg></div>`;
}
function groupedCrit(sel, aggs){
  const W=900, H=250, L=34, R=10, T=16, B=30, G=NCRIT, gw=(W-L-R)/G, n=sel.length, bw=Math.min(26,(gw-18)/n);
  const y=v=>T+(1-v/3)*(H-T-B);
  let g='';
  [0,1,2,3].forEach(v=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e6ebf3"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`; });
  for(let c=0;c<G;c++){
    const x0=L+c*gw+(gw-n*(bw+2))/2;
    g+=`<text class="ax" x="${L+c*gw+gw/2}" y="${H-10}" text-anchor="middle"><title>${esc(crit()[c])}</title>${esc(crit()[c].split(' ').slice(0,2).join(' '))}</text>`;
    sel.forEach((si,k)=>{ const v=aggs[k].crit[c]; if(isNaN(v)) return; const xx=x0+k*(bw+2), yy=y(v), hh=y(0)-yy;
      g+=`<path d="M${xx} ${y(0)} V${yy+3} q0 -3 3 -3 h${bw-6} q3 0 3 3 V${y(0)} Z" fill="${SC_COL[si]}" data-tip="${esc(SCHOOLS_L[lang][si]+' · '+crit()[c]+': '+num(v)+' / 3')}"/>`; });
  }
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('cmpCrit'))}">${g}</svg></div>`;
}
function donut(x, color){
  const R=50, r=33, C=60, parts=[['hi','#12805c'],['mid','#d08a00'],['lo','#b3261e']], tot=x.n;
  if(!tot) return `<svg viewBox="0 0 120 120"><circle cx="${C}" cy="${C}" r="${(R+r)/2}" fill="none" stroke="#e6ebf3" stroke-width="${R-r}"/><text x="${C}" y="${C+4}" text-anchor="middle" class="ax">–</text></svg>`;
  let a0=-Math.PI/2, segs='';
  const pt=(rad,a)=>`${(C+rad*Math.cos(a)).toFixed(2)} ${(C+rad*Math.sin(a)).toFixed(2)}`;
  parts.forEach(([k,col])=>{ const v=x.lv[k]; if(!v) return; let a1=a0+v/tot*2*Math.PI; const gap=tot>v?0.03:0;
    const s=a0+gap, e=a1-gap, big=(e-s)>Math.PI?1:0;
    segs += (v===tot) ? `<circle cx="${C}" cy="${C}" r="${(R+r)/2}" fill="none" stroke="${col}" stroke-width="${R-r}" data-tip="${esc(lvName(k)+': '+v+' ('+pc(v/tot)+')')}"/>`
      : `<path d="M${pt(R,s)} A${R} ${R} 0 ${big} 1 ${pt(R,e)} L${pt(r,e)} A${r} ${r} 0 ${big} 0 ${pt(r,s)} Z" fill="${col}" data-tip="${esc(lvName(k)+': '+v+' ('+pc(v/tot)+')')}"/>`;
    a0=a1; });
  return `<svg viewBox="0 0 120 120" role="img" aria-label="${esc(parts.map(([k])=>lvName(k)+' '+x.lv[k]).join(', '))}">${segs}<text x="${C}" y="${C+6}" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#14213d">${pc(x.avgPct)}</text></svg>`;
}
function renderCompare(sy, yr){
  if(!cmpSel){ const cnt=SCHOOLS.map((s,i)=>({i,n:yr.filter(r=>r.school===s).length})).sort((a,b)=>b.n-a.n); cmpSel=cnt.slice(0,2).map(o=>o.i).sort((a,b)=>a-b); }
  $('pChips').innerHTML = SCHOOLS.map((s,i)=>`<button type="button" class="chip${cmpSel.includes(i)?' on':''}" data-s="${i}" style="${scVar(i)}" aria-pressed="${cmpSel.includes(i)}"><span class="snum" style="background:var(--sc)">${i+1}</span>${esc(SCHOOLS_L[lang][i])}</button>`).join('');
  $('pChips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ const i=+b.dataset.s;
    if(cmpSel.includes(i)) cmpSel=cmpSel.filter(v=>v!==i); else { if(cmpSel.length>=6){ toast(t('cmpMax'),true); return; } cmpSel=[...cmpSel,i].sort((a,b)=>a-b); }
    ls.set('sb_cmp', JSON.stringify(cmpSel)); renderCompare(sy, yr); });
  if(cmpSel.length<2){ $('pCmp').innerHTML=`<p class="note">${t('cmpNeed')}</p>`; return; }
  const months=monthSeries(yr, sy).map(p=>p.k), city=monthSeries(yr, sy);
  const aggs=cmpSel.map(i=>agg(yr.filter(r=>r.school===SCHOOLS[i])));
  const series=cmpSel.map(i=>({name:SCHOOLS_L[lang][i], color:SC_COL[i], pts:months.map(k=>{ const l=yr.filter(r=>r.school===SCHOOLS[i] && ymOf(r.date)===k); return {k, v:l.length?agg(l).avgPct:null, n:l.length}; })}));
  const legend = `<div class="legend">${cmpSel.map(i=>`<span><i style="${scVar(i)}"></i>${esc(SCHOOLS_L[lang][i])}</span>`).join('')}<span><i class="dash"></i>${esc(t('cityLine'))}</span></div>`;
  const legendSq = `<div class="legend">${cmpSel.map(i=>`<span><i class="sq" style="${scVar(i)}"></i>${esc(SCHOOLS_L[lang][i])}</span>`).join('')}</div>`;
  const maxQ=Math.max(...aggs.map(a=>isNaN(a.avgPct)?0:a.avgPct), .01);
  $('pCmp').innerHTML = `
    <div class="cmpsec"><h3>${ic('prog')}${t('cmpDyn')}</h3>${legend}${multiLine(series, months, city)}</div>
    <div class="cmpsec"><h3>${ic('table')}${t('cmpBar')}</h3>
      ${cmpSel.map((i,k)=>{ const a=aggs[k]; return `<div class="hbar" style="${scVar(i)}"><span><span class="sdot"></span>${esc(SCHOOLS_L[lang][i])}</span><div class="bar"><i style="width:${isNaN(a.avgPct)?0:Math.round(a.avgPct*100)}%"></i></div><b style="text-align:right">${pc(a.avgPct)}</b><span class="small">${esc(t('obsN',a.n))}</span></div>`; }).join('')}</div>
    <div class="cmpsec"><h3>${ic('award')}${t('cmpCrit')}</h3>${legendSq}${groupedCrit(cmpSel, aggs)}<p class="small">${crit().map(esc).join(' · ')}</p></div>
    <div class="cmpsec"><h3>${ic('target')}${t('cmpShare')}</h3>
      <div class="legend"><span><i class="sq" style="--sc:#12805c"></i>${esc(t('lvHi'))}</span><span><i class="sq" style="--sc:#d08a00"></i>${esc(t('lvMid'))}</span><span><i class="sq" style="--sc:#b3261e"></i>${esc(t('lvLo'))}</span></div>
      <div class="donuts">${cmpSel.map((i,k)=>`<div class="donut" style="${scVar(i)}">${donut(aggs[k], SC_COL[i])}<div class="dn"><span class="sdot"></span>${esc(SCHOOLS_L[lang][i])}</div><div class="small">${esc(t('obsN',aggs[k].n))}</div></div>`).join('')}</div></div>`;
}

function trendChart(recs){
  if(recs.length<2) return `<p class="note">${t('trendNeed')}</p>`;
  const W=600,H=190,L=58,R=22,T=22,B=30, n=recs.length;
  const x=i=>L+i*(W-L-R)/(n-1), y=v=>T+(1-v)*(H-T-B);
  const grid=[0,.5,1].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e8f1"/><text x="${L-24}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#5b6780">${v*100}%</text>`).join('');
  const step=Math.ceil(n/8);
  const pts=recs.map((r,i)=>[x(i),y(pct(r))]);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(t('trend'))}">${grid}
    <polyline fill="none" stroke="var(--acc)" stroke-width="2.5" points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}"/>
    ${recs.map((r,i)=>`<circle cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="5" fill="var(--${lvKey(total(r))==='hi'?'hi':lvKey(total(r))==='mid'?'mid':'lo'})" stroke="#fff" stroke-width="2"/>
      <text x="${pts[i][0].toFixed(1)}" y="${(pts[i][1]-10).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="#14213d">${pc(pct(r))}</text>
      ${i%step===0||i===n-1?`<text x="${pts[i][0].toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="11" fill="#5b6780">${fmtDate(r.date).slice(0,5)}</text>`:''}`).join('')}</svg>`;
}

  const g=G.groups.get(cardGid);
  if(!g){ $('cardOut').innerHTML=`<div class="btns noprint" style="margin-bottom:12px"><button class="btn soft" id="cBack">${ic('back')}${t('back')}</button></div><p class="note">${t('notFound')}</p>`; $('cBack').onclick=goBack; return; }
  const recs=g.recs, a=agg(recs), f=recs[0], l=recs[recs.length-1], ce=catExpOf(recs);
  const subjects=[...new Set(recs.map(r=>r.subject).filter(Boolean))].join(', ');
  const ini=norm(g.name).split(' ').slice(0,2).map(w=>w.charAt(0)).join('').toUpperCase() || '?';
  const ord=a.crit.map((v,i)=>({i,v}));
  const strong=ord.filter(o=>o.v>=2.5).sort((p,q)=>q.v-p.v), weak=ord.filter(o=>o.v<2).sort((p,q)=>p.v-q.v);
  const li=o=>`<li><span>${esc(crit()[o.i])}</span><b>${num(o.v)} / 3</b></li>`;
  const others=[...g.variants].filter(v=>v!==g.name);
  $('cardOut').innerHTML = `
    <div class="btns noprint" style="margin-bottom:12px"><button class="btn soft" id="cBack">${ic('back')}${t('back')}</button><button class="btn ghost" id="cPrint">${ic('print')}${t('print')}</button></div>
    <div class="card prof">
      <div class="avatar">${esc(ini)}</div>
      <div class="pinfo"><h2 class="pname plain">${esc(g.name)}</h2>
        <div class="pmeta">${sdot(g.school)}${esc(sName(g.school))}${subjects?' · '+esc(subjects):''}${ce?' · '+esc(ce):''}</div>
        ${others.length?`<div class="small" style="margin-top:4px">${esc(t('spellings'))} ${esc(others.join('; '))}</div>`:''}</div>
      <div>${lvlTag(total(l))}</div>
    </div>
    <div class="kpis">
      ${kpi('eye','#1746a2','#e7eefc',recs.length,t('kObs'))}
      ${kpi('target','#0e7490','#dff2f7',pc(a.avgPct),t('kQuality'))}
      ${kpi('award','#c2650a','#fdf0e1',pc(pct(l)),t('kLastQ'))}
      <div class="kpi"><div class="ki" style="--kc:#6a3fc8;--kb:#efe9fc">${ic('prog')}</div><div><b>${recs.length>1?delta(pct(f),pct(l)):'–'}</b><span>${esc(t('kChange'))}</span></div></div>
    </div>
    <div class="grid2">
      <div class="card sw good"><h2>${ic('star')}${t('strengths')}</h2>${strong.length?`<ul class="swl">${strong.map(li).join('')}</ul>`:`<p class="note">${t('noStrong')}</p>`}</div>
      <div class="card sw bad"><h2>${ic('alert')}${t('weaknesses')}</h2>${weak.length?`<ul class="swl">${weak.map(li).join('')}</ul>`:`<p class="note">${t('noWeak')}</p>`}</div>
    </div>
    <p class="small" style="margin:-6px 0 16px">${t('swHint')}</p>
    <div class="grid2">
      <div class="card"><h2>${t('critProfile')}</h2>${crit().map((c,i)=>critBar(c,a.crit[i])).join('')}
        <div class="cavg"><span>${t('overallAvg')}</span><b style="color:${cColor(a.avgTotal/NCRIT)}">${num(a.avgTotal/NCRIT)} / 3</b></div></div>
      <div class="card"><h2>${t('trend')}</h2>${trendChart(recs)}</div>
    </div>
    <div class="card"><h2>${t('history')}</h2><div class="scroll"><table>
      <tr><th class="n">${t('no')}</th><th>${t('hDate')}</th><th>${t('observer')}</th><th>${t('hSubj')}</th>${crit().map((c,i)=>`<th class="n" title="${esc(c)}">${i+1}</th>`).join('')}<th class="n">${t('hTotal')}</th><th class="n">${t('qualityPct')}</th><th>${t('hLevel')}</th><th style="min-width:260px">${t('noteLbl')}</th></tr>
      ${recs.map((r,i)=>`<tr><td class="n">${i+1}</td><td>${fmtDate(r.date)}</td><td>${esc(r.observer||'')}</td><td>${esc(subjKlass(r))}</td>${r.scores.map(s=>`<td class="n">${s}</td>`).join('')}<td class="n"><b>${total(r)}</b></td><td class="n">${pc(pct(r))}</td><td>${lvlTag(total(r))}</td><td style="white-space:pre-wrap">${esc(r.note)}</td></tr>`).join('')}
    </table></div><p class="small">${crit().map(esc).join(' · ')}</p></div>`;
  $('cBack').onclick=goBack;
  $('cPrint').onclick=()=>window.print();
}

/* ============ ЕСЕП ЖҮКТЕУ ============ */
function download(blob, name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
function loadExcel(){ return window.ExcelJS ? Promise.resolve() : new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=EXCELJS; s.onload=ok; s.onerror=()=>no(new Error(t('eExcel'))); document.head.appendChild(s); }); }
const F={name:'Times New Roman',size:12};
const thin={style:'thin',color:{argb:'FF000000'}}, box={top:thin,left:thin,bottom:thin,right:thin};
const headFill={type:'pattern',pattern:'solid',fgColor:{argb:'FFDCE6F7'}};
function addSchoolSheet(wb, name, school, recs, label){
  const ws=wb.addWorksheet(name,{pageSetup:{orientation:'landscape',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:.4,right:.4,top:.5,bottom:.5,header:.2,footer:.2}}});
  [5,28,20,22,12,12,12,12,12,12,12,10,17,42].forEach((w,i)=>ws.getColumn(i+1).width=w);
  const wrap={wrapText:true,vertical:'middle'}, ctr={...wrap,horizontal:'center'}, bold={...F,bold:true};
  ws.mergeCells('A1:N1'); ws.getCell('A1').value=t('title'); ws.getCell('A1').font={...F,bold:true,size:13}; ws.getCell('A1').alignment=ctr; ws.getRow(1).height=30;
  [[t('orgName'),school],[t('goalLbl'),t('goal')],[t('termLbl'),label]].forEach((p,i)=>{ const r=i+2;
    ws.mergeCells(r,1,r,3); ws.mergeCells(r,4,r,14); ws.getCell(r,1).value=p[0]; ws.getCell(r,1).font=bold; ws.getCell(r,4).value=p[1]; ws.getCell(r,4).font=F; ws.getCell(r,4).alignment=wrap; });
  ws.mergeCells('A5:N5'); ws.getCell('A5').value=t('scale'); ws.getCell('A5').font={...F,italic:true};
  const head=[t('no'),t('hTeacher'),t('hSubj'),t('hCat'),...crit(),t('hTotal'),t('qualityPct'),t('hLevel'),t('noteLbl')];
  head.forEach((x,i)=>{ const c=ws.getCell(7,i+1); c.value=x; c.font=bold; c.alignment=ctr; c.border=box; c.fill=headFill; });
  ws.getRow(7).height=62;
  const r0=8, n=Math.max(recs.length,1), rN=r0+n-1, HI=t('lvHi'), MID=t('lvMid'), LO=t('lvLo');
  for(let i=0;i<n;i++){ const r=r0+i, x=recs[i], row=ws.getRow(r);
    row.getCell(1).value=i+1;
    if(x){ const s=total(x);
      row.getCell(2).value=gname(x); row.getCell(3).value=subjKlass(x)+'\n'+fmtDate(x.date); row.getCell(4).value=catExp(x);
      x.scores.forEach((v,j)=>row.getCell(5+j).value=v);
      row.getCell(11).value={formula:`IF(COUNT(E${r}:J${r})>0,SUM(E${r}:J${r}),"")`,result:s};
      row.getCell(12).value={formula:`IF(K${r}<>"",K${r}/${MAXP},"")`,result:s/MAXP};
      row.getCell(13).value={formula:`IF(K${r}="","",IF(K${r}>=15,"${HI}",IF(K${r}>=11,"${MID}","${LO}")))`,result:lvName(lvKey(s))};
      row.getCell(14).value=x.note||''; }
    for(let c=1;c<=14;c++){ const cell=row.getCell(c); cell.font=F; cell.border=box; cell.alignment=(c===2||c===14)?wrap:ctr; }
    row.getCell(12).numFmt='0%';
  }
  const a=agg(recs), rA=rN+1; ws.mergeCells(rA,2,rA,4); ws.getCell(rA,2).value=t('schoolAvg');
  'EFGHIJKL'.split('').forEach((L,j)=>{ const c=ws.getCell(L+rA); const res = j<6 ? a.crit[j] : j===6 ? a.avgTotal : a.avgPct;
    c.value={formula:`IFERROR(AVERAGE(${L}${r0}:${L}${rN}),"")`,result:isNaN(res)?'':res}; c.numFmt = L==='L'?'0%':'0.0'; });
  for(let c=1;c<=14;c++){ const cell=ws.getCell(rA,c); cell.font=bold; cell.border=box; cell.alignment=c===2?wrap:ctr; cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF2F2F2'}}; }
  const d=rA+2; ws.mergeCells(d,2,d,6); ws.getCell(d,2).value=t('distTitle'); ws.getCell(d,2).font=bold;
  [t('dLevel'),t('dRange'),t('dShare'),t('dCount'),t('dPct')].forEach((x,i)=>{ const c=ws.getCell(d+1,2+i); c.value=x; c.font=bold; c.border=box; c.alignment=ctr; c.fill=headFill; });
  const rng=`M${r0}:M${rN}`, cnt=`COUNT(K${r0}:K${rN})`;
  [[HI,t('r1'),'83% – 100%',a.lv.hi],[MID,t('r2'),'61% – 82%',a.lv.mid],[LO,t('r3'),'≤ 60%',a.lv.lo]].forEach((p,i)=>{ const r=d+2+i;
    ws.getCell(r,2).value=p[0]; ws.getCell(r,3).value=p[1]; ws.getCell(r,4).value=p[2];
    ws.getCell(r,5).value={formula:`COUNTIF(${rng},"${p[0]}")`,result:p[3]};
    ws.getCell(r,6).value={formula:`IF(${cnt}>0,E${r}/${cnt},0)`,result:a.n?p[3]/a.n:0}; ws.getCell(r,6).numFmt='0%';
    for(let c=2;c<=6;c++){ const cell=ws.getCell(r,c); cell.font=F; cell.border=box; cell.alignment=c===2?wrap:ctr; } });
  const rT=d+5; ws.mergeCells(rT,2,rT,4); ws.getCell(rT,2).value=t('dTotalX');
  ws.getCell(rT,5).value={formula:cnt,result:a.n}; ws.getCell(rT,6).value={formula:`IF(${cnt}>0,SUM(F${d+2}:F${d+4}),0)`,result:a.n?1:0}; ws.getCell(rT,6).numFmt='0%';
  for(let c=2;c<=6;c++){ const cell=ws.getCell(rT,c); cell.font=bold; cell.border=box; cell.alignment=c===2?wrap:ctr; }
}
const sheetName = i => ((i+1)+'. '+SCHOOLS_L[lang][i].replace(/[\\\/\?\*\[\]:]/g,'').replace(/ КММ$/,'')).slice(0,31);
async function saveWb(wb, name){ const buf=await wb.xlsx.writeBuffer(); download(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), name); }
async function withBtn(btn, fn){ btn.disabled=true; try { await loadExcel(); await fn(); toast(t('tReport')); } catch(e){ toast(e.message||t('eGeneric'),true); } btn.disabled=false; }
$('xlsOne').onclick=function(){ withBtn(this, async()=>{ const {idx,school,recs,label}=tableData();
  const wb=new ExcelJS.Workbook(); addSchoolSheet(wb, sheetName(idx), school, recs, label);
  await saveWb(wb, `${t('fileOne')}_${idx+1}_${today()}.xlsx`); }); };
$('xlsAll').onclick=function(){ withBtn(this, async()=>{ const recs=filterYM(live(),'hYear','hMonth'), label=labelYM('hYear','hMonth');
  const wb=new ExcelJS.Workbook(), ws=wb.addWorksheet(t('citySheet'),{pageSetup:{orientation:'landscape',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0}});
  [5,46,13,13,13,12,12,12,12].forEach((w,i)=>ws.getColumn(i+1).width=w);
  const ctr={wrapText:true,vertical:'middle',horizontal:'center'};
  ws.mergeCells('A1:I1'); ws.getCell('A1').value=t('cityTitle'); ws.getCell('A1').font={...F,bold:true,size:13}; ws.getCell('A1').alignment=ctr; ws.getRow(1).height=30;
  ws.mergeCells('A2:I2'); ws.getCell('A2').value=t('termLbl')+' '+label; ws.getCell('A2').font=F;
  [t('no'),t('school'),t('lessons'),t('teachersN'),t('kAvg'),t('qualityPct'),t('lvHi'),t('lvMid'),t('lvLo')].forEach((x,i)=>{ const c=ws.getCell(4,i+1); c.value=x; c.font={...F,bold:true}; c.alignment=ctr; c.border=box; c.fill=headFill; });
  ws.getRow(4).height=48;
  const line=(r,no,nm,x,b)=>{ [no,nm,x.n,x.teachers,isNaN(x.avgTotal)?'':x.avgTotal,isNaN(x.avgPct)?'':x.avgPct,x.lv.hi,x.lv.mid,x.lv.lo].forEach((v,i)=>{ const c=ws.getCell(r,i+1); c.value=v; c.font=b?{...F,bold:true}:F; c.border=box; c.alignment=i===1?{wrapText:true,vertical:'middle'}:ctr; }); ws.getCell(r,5).numFmt='0.0'; ws.getCell(r,6).numFmt='0%'; };
  SCHOOLS.forEach((s,i)=>line(5+i,i+1,SCHOOLS_L[lang][i],agg(recs.filter(r=>r.school===s))));
  line(5+SCHOOLS.length,'',t('city'),agg(recs),true);
  SCHOOLS.forEach((s,i)=>{ const rs=recs.filter(r=>r.school===s).sort(byDate); if(rs.length) addSchoolSheet(wb, sheetName(i), SCHOOLS_L[lang][i], rs, label); });
  await saveWb(wb, `${t('fileAll')}_${today()}.xlsx`); }); };
$('jsonAll').onclick=()=>{ download(new Blob([JSON.stringify({exportedAt:new Date().toISOString(),records},null,1)],{type:'application/json'}), `sabaq-baqylau_${today()}.json`); toast(t('tBackup')); };

applyLang();
(async function boot(){
  ls.del('sb_mode'); // демо режим есте сақталмайды: сайт әрқашан кіру бетінен ашылады
  const name=ls.get('sb_name')||''; $('lgName').value=name;
  const token=ls.get('sb_token'); if(token && name){ $('lgToken').value=token; await enter(GitHubStore(token), name); }
})();
</script>
